name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      # Ruff is intentionally installed directly, not via the Pipfile:
      # adding it there would re-resolve Pipfile.lock. Keep it out.
      - name: Install linter
        run: pip install ruff

      - name: Lint
        run: ruff check .

      # Offline unit tests only (no NOTION_API_KEY needed). Live Notion
      # tests are marked `integration`, skipped by default in pytest.ini.
      - name: Run offline unit tests
        run: pipenv run pytest --cov=src/ --cov-report=term-missing
