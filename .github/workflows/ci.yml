name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Lint
        run: pipenv run ruff check .

      # Offline unit tests only (no NOTION_API_KEY needed). Live Notion
      # tests are marked `integration`, skipped by default in pytest.ini.
      - name: Run offline unit tests
        run: pipenv run pytest --cov=src/ --cov-report=term-missing --cov-report=xml

      # Upload coverage to Codecov. Skipped when no token is configured:
      # public repos can upload tokenless, but the org token is needed for
      # protected-branch uploads (see personal-reporting PR #166, where an
      # empty CODECOV_TOKEN broke the build). Upload failures never fail
      # the build.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
