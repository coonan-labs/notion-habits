[pytest]
testpaths = tests
# Put the repo root on sys.path so `from src...` imports work however
# pytest is launched. Without this, `python -m pytest` works (it adds the
# current directory) but the `pytest` console script used by `pipenv run`
# in CI fails with `ModuleNotFoundError: No module named 'src'`.
pythonpath = .
# Offline tests run by default. Live Notion tests are marked `integration`
# and only run with an explicit override, e.g.:
#   NOTION_API_KEY=<key> pytest -m integration -o addopts=''
addopts = -m "not integration"
markers =
    integration: tests that hit the live Notion API (needs NOTION_API_KEY)
